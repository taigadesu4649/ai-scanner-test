<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI蔵書スキャナー PoC</title>
</head>
<body>
    <h2>AI読み込みテスト</h2>
    
    <!-- スマホの実機カメラを起動するボタン -->
    <input type="file" accept="image/*" capture="environment" id="cameraInput">
    <br><br>
    
    <button id="scanBtn" style="padding: 15px; font-size: 16px;">スキャン開始（初回AIダウンロードあり）</button>
    
    <div style="margin-top: 20px; font-weight: bold; color: blue;" id="status">1. 写真を撮ってからボタンを押してください</div>

    <!-- 最新のTransformers.js (v3) を読み込む -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0-alpha.19';
        
        const statusEl = document.getElementById('status');
        const cameraInput = document.getElementById('cameraInput');
        const scanBtn = document.getElementById('scanBtn');

        scanBtn.addEventListener('click', async () => {
            if (!cameraInput.files.length) {
                statusEl.innerText = "エラー：先に写真を撮影してください";
                return;
            }
            
            try {
                statusEl.innerText = "AIをダウンロード中...（数分かかる場合があります。画面を閉じないでください）";
                
                // 【修正完了】不要なカッコや設定を完全に削除し、標準モードで安定起動させる
                const generator = await pipeline('image-to-text', 'Xenova/vit-gpt2-image-captioning');
                
                statusEl.innerText = "AI準備完了！画像を解析中...";
                
                // 撮った画像をブラウザ用のURLに変換
                const imageUrl = URL.createObjectURL(cameraInput.files[0]);
                
                // AIに画像を渡して解析
                const output = await generator(imageUrl);
                
                statusEl.innerText = "成功！結果:\n" + JSON.stringify(output);
                
                // 次のテストのためにメモリのゴミ箱を空にする
                URL.revokeObjectURL(imageUrl);
                
            } catch (error) {
                statusEl.innerText = "クラッシュ・エラー発生:\n" + error.message;
            }
        });
    </script>
</body>
</html>
