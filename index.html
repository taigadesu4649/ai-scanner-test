<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>読書管理アプリ</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; color: #333; }
        .screen { display: none; padding: 20px; padding-top: 60px; }
        .screen.active { display: block; }
        
        /* ハンバーガーメニュー */
        #menu-btn { position: fixed; top: 15px; right: 15px; font-size: 24px; background: none; border: none; z-index: 1000; cursor: pointer; }
        #side-menu { position: fixed; top: 0; right: -250px; width: 200px; height: 100%; background: white; box-shadow: -2px 0 5px rgba(0,0,0,0.1); transition: right 0.3s; z-index: 999; padding-top: 60px; }
        #side-menu.open { right: 0; }
        .menu-item { display: block; padding: 15px 20px; text-decoration: none; color: #333; border-bottom: 1px solid #eee; font-weight: bold; }
        
        /* 共通UIパーツ */
        .box { background: #e0e0e0; padding: 20px; text-align: center; margin-bottom: 20px; border-radius: 8px; }
        .btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; border: none; background: #ccc; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .btn-primary { background: #d98cb3; color: white; } /* 追加ボタンなど */
        .btn-warning { background: #e6e6a1; } /* やり直しなど */
        
        h1, h2 { text-align: center; font-size: 20px; margin-top: 0; }
        .scroll-box { height: 300px; overflow-y: auto; background: #d0d0d0; padding: 10px; margin-bottom: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- ハンバーガーメニューボタン -->
    <button id="menu-btn">🍔</button>

    <!-- スライドメニュー -->
    <div id="side-menu">
        <a href="#" class="menu-item" onclick="nav('home')">ホーム</a>
        <a href="#" class="menu-item" onclick="nav('read-list')">読了本一覧</a>
        <a href="#" class="menu-item" onclick="nav('record')">読書記録</a>
    </div>

    <!-- 1. ホーム画面 -->
    <div id="home" class="screen active">
        <div class="box">アプリ名とアイコン</div>
        <button class="btn btn-primary" style="width: auto; float: right; padding: 5px 15px;" onclick="nav('scan-permission')">追加</button>
        <div style="clear: both;"></div>
        <div class="scroll-box" onclick="nav('book-detail-before')">
            未読電子本棚<br>（ここをタップで詳細画面へテスト移動）
        </div>
        <div class="box">読んだページ数: 0</div>
    </div>

    <!-- 2. 申請許可（カメラスキャン準備）画面 -->
    <div id="scan-permission" class="screen">
        <div class="box" style="height: 300px; line-height: 300px;">カメラの許可申請・撮影</div>
        <button class="btn btn-warning" onclick="nav('scan-result')">撮影完了（仮）</button>
        <button class="btn" onclick="nav('home')">キャンセル</button>
    </div>

    <!-- 3. スキャン結果画面 -->
    <div id="scan-result" class="screen">
        <div class="box" style="height: 200px;">スキャン結果</div>
        <button class="btn btn-warning" onclick="nav('scan-permission')">スキャンのやり直し</button>
        <button class="btn btn-primary" onclick="nav('home')">追加する</button>
    </div>

    <!-- 4. 本の詳細（読書前）画面 -->
    <div id="book-detail-before" class="screen">
        <div class="box">本のタイトル名</div>
        <p style="font-size: 12px; text-align: center; margin-bottom: 5px;">現在のページ数を入力してください</p>
        <div class="box">現在のページ数の入力</div>
        <div class="box">タイマー設定</div>
        <button class="btn" onclick="nav('book-detail-after')">読書開始</button>
        <button class="btn">完読</button>
        <button class="btn" onclick="nav('home')">この本を削除する</button>
        <button class="btn" onclick="nav('home')">ホームに戻る</button>
    </div>

    <!-- 5. 本の詳細（読書後）画面 -->
    <div id="book-detail-after" class="screen">
        <div class="box">本のタイトル名</div>
        <p style="font-size: 12px; text-align: center; margin-bottom: 5px;">現在のページ数を入力してください</p>
        <div class="box">現在のページ数の入力</div>
        <div class="box">タイマー設定 (カウントダウン)</div>
        <button class="btn" onclick="nav('home')">読書終了</button>
        <button class="btn">完読</button>
        <button class="btn" onclick="nav('home')">この本を削除する</button>
        <button class="btn" onclick="nav('home')">ホームに戻る</button>
    </div>

    <!-- 6. 読了本一覧画面 -->
    <div id="read-list" class="screen">
        <div class="box">アプリ名とアイコン</div>
        <div class="scroll-box">完読電子本棚</div>
        <div class="box">完読ページ数: 0</div>
    </div>

    <!-- 7. 読書記録画面 -->
    <div id="record" class="screen">
        <div class="box">タブ: 年 / 月 / 週 / 日</div>
        <div class="box" style="height: 300px;">読書記録<br>(グラフ表示エリア)</div>
    </div>

    <script>
        // 画面切り替え関数
        function nav(targetId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(targetId).classList.add('active');
            document.getElementById('side-menu').classList.remove('open'); // 移動時にメニューを閉じる
            window.scrollTo(0, 0); // 画面上部へスクロール
        }

        // ハンバーガーメニューの開閉
        document.getElementById('menu-btn').addEventListener('click', () => {
            document.getElementById('side-menu').classList.toggle('open');
        });
    </script>
</body>
</html>
